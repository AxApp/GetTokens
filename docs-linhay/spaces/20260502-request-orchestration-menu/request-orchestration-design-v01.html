<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetTokens / Request Orchestration Design V01</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f1eb;
        --panel: #ffffff;
        --panel-2: #e8e7df;
        --ink: #050505;
        --muted: #55554e;
        --soft: #85857b;
        --line: #050505;
        --inverse: #050505;
        --inverse-ink: #ffffff;
        --shadow: #d0cfc6;
        --accent: #f05a28;
        --accent-soft: #fff0e8;
        --green: #148247;
        --green-soft: #e8f6ee;
        --yellow: #8b6400;
        --yellow-soft: #fff3c8;
        --red: #b91c28;
        --red-soft: #fff0f2;
        --mono: "IBM Plex Mono", "SFMono-Regular", "SF Mono", ui-monospace, monospace;
        --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #050505;
          --panel: #111111;
          --panel-2: #1d1d1a;
          --ink: #f6f6ee;
          --muted: #c8c7bd;
          --soft: #929187;
          --line: #f6f6ee;
          --inverse: #f6f6ee;
          --inverse-ink: #050505;
          --shadow: #292925;
          --accent-soft: rgba(240, 90, 40, 0.2);
          --green-soft: rgba(20, 130, 71, 0.22);
          --yellow-soft: rgba(139, 100, 0, 0.24);
          --red-soft: rgba(185, 28, 40, 0.24);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-rows: 62px minmax(0, 1fr);
        background:
          linear-gradient(var(--panel-2) 1px, transparent 1px),
          linear-gradient(90deg, var(--panel-2) 1px, transparent 1px),
          var(--bg);
        background-size: 24px 24px, 24px 24px, auto;
      }

      .topbar {
        background: var(--panel);
        border-bottom: 2px solid var(--line);
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto;
        align-items: stretch;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
      }

      .mark {
        width: 40px;
        height: 40px;
        border: 2px solid var(--line);
        background: var(--inverse);
        color: var(--inverse-ink);
        box-shadow: 4px 4px 0 var(--shadow);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-weight: 900;
      }

      h1,
      h2,
      h3,
      .brand strong {
        margin: 0;
        letter-spacing: 0;
      }

      h1,
      .brand strong {
        font-size: 17px;
        text-transform: uppercase;
        line-height: 1;
      }

      .brand-copy {
        display: grid;
        gap: 4px;
      }

      .muted,
      .micro,
      .locator,
      .path-token,
      .label {
        font-family: var(--mono);
        letter-spacing: 0;
      }

      .muted {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0 12px;
      }

      .btn,
      .mini,
      .flow-card,
      .item,
      .test-btn {
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        box-shadow: 4px 4px 0 var(--shadow);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0;
        transition: transform 75ms ease, box-shadow 75ms ease, background 75ms ease;
      }

      .btn,
      .mini,
      .test-btn {
        min-height: 34px;
        padding: 0 10px;
      }

      .mini {
        min-height: 28px;
        padding: 0 8px;
        box-shadow: none;
        font-size: 9px;
      }

      .btn.primary,
      .mini.active,
      .flow-card.active,
      .item.active,
      .test-btn {
        background: var(--inverse);
        color: var(--inverse-ink);
      }

      .mini.warn {
        color: var(--yellow);
        background: var(--yellow-soft);
      }

      .btn:active,
      .mini:active,
      .flow-card:active,
      .item:active,
      .test-btn:active {
        transform: translate(3px, 3px) scale(0.98);
        box-shadow: 1px 1px 0 var(--shadow);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .flow-card span,
      .item small {
        color: inherit;
        opacity: 0.72;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.35;
      }

      .flow-tools {
        border-left: 2px solid var(--line);
        background: var(--panel-2);
        padding: 0 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .input {
        width: 210px;
        min-height: 34px;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 0 9px;
        font-family: var(--mono);
        font-size: 11px;
        outline: none;
      }

      .input:focus {
        box-shadow: 4px 4px 0 var(--shadow);
      }

      .row {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
      }

      .workspace {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 14px 18px 22px;
      }

      .flow-stack {
        min-width: 1220px;
        max-width: 1500px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }

      .flow-group {
        border: 2px solid var(--line);
        background: var(--panel);
        box-shadow: 6px 6px 0 var(--shadow);
      }

      .group-head {
        width: 100%;
        min-height: 76px;
        border: 0;
        background: var(--panel);
        color: var(--ink);
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr) auto;
        align-items: stretch;
        padding: 0;
        text-align: left;
      }

      .flow-group.active .group-head {
        background: var(--panel-2);
        border-bottom: 2px solid var(--line);
      }

      .group-index {
        border-right: 2px solid var(--line);
        background: var(--inverse);
        color: var(--inverse-ink);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 900;
      }

      .group-main {
        min-width: 0;
        padding: 12px 14px;
        display: grid;
        gap: 7px;
      }

      .group-main strong {
        font-size: 14px;
        text-transform: uppercase;
      }

      .group-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .group-actions {
        min-width: 180px;
        border-left: 2px solid var(--line);
        display: grid;
        place-items: center;
        padding: 0 12px;
      }

      .group-actions .badge {
        min-width: 72px;
        justify-content: center;
      }

      .group-body {
        background:
          linear-gradient(var(--panel-2) 1px, transparent 1px),
          linear-gradient(90deg, var(--panel-2) 1px, transparent 1px),
          var(--bg);
        background-size: 18px 18px, 18px 18px, auto;
        display: grid;
        gap: 14px;
        padding: 14px;
      }

      .group-detail {
        border: 2px solid var(--line);
        background: var(--panel);
        display: grid;
        grid-template-columns: 1.1fr repeat(4, minmax(140px, 1fr));
        box-shadow: 4px 4px 0 var(--shadow);
      }

      .detail-title,
      .detail-cell {
        min-width: 0;
        min-height: 66px;
        padding: 10px;
        display: grid;
        align-content: center;
        gap: 6px;
      }

      .detail-title {
        background: var(--inverse);
        color: var(--inverse-ink);
      }

      .detail-cell {
        border-left: 2px solid var(--line);
        background: var(--panel);
      }

      .detail-title strong,
      .detail-cell strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        text-transform: uppercase;
      }

      .detail-title span,
      .detail-cell span {
        color: inherit;
        opacity: 0.72;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(280px, 1fr));
        gap: 14px;
        align-items: stretch;
      }

      .flow-card-panel {
        min-height: calc(100vh - 420px);
        border: 2px solid var(--line);
        background: var(--panel);
        box-shadow: 6px 6px 0 var(--shadow);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .card-head {
        min-height: 72px;
        border-bottom: 2px solid var(--line);
        background: var(--panel-2);
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
      }

      .card-no {
        border-right: 2px solid var(--line);
        background: var(--inverse);
        color: var(--inverse-ink);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 900;
      }

      .card-title {
        padding: 11px;
        display: grid;
        gap: 5px;
      }

      .card-title strong {
        font-size: 13px;
        text-transform: uppercase;
      }

      .card-list {
        min-height: 0;
        overflow: auto;
        padding: 10px;
        display: grid;
        align-content: start;
        gap: 9px;
      }

      .card-config {
        border-top: 2px solid var(--line);
        background: var(--panel-2);
        padding: 10px;
        display: grid;
        gap: 9px;
      }

      .config-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .item {
        min-height: 72px;
        padding: 9px;
        display: grid;
        gap: 7px;
        align-content: space-between;
        text-align: left;
        box-shadow: none;
      }

      .item.disabled {
        opacity: 0.45;
      }

      .item.blocked {
        opacity: 0.55;
      }

      .account-item {
        min-height: 96px;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 0;
        padding: 4px 0 4px 12px;
      }

      .timeline::before {
        content: "";
        position: absolute;
        top: 18px;
        bottom: 18px;
        left: 24px;
        width: 2px;
        background: var(--line);
      }

      .timeline-step {
        position: relative;
        min-height: 82px;
        padding: 8px 0 8px 42px;
        display: grid;
        align-content: center;
        gap: 6px;
      }

      .timeline-dot {
        position: absolute;
        top: 17px;
        left: 3px;
        width: 20px;
        height: 20px;
        border: 2px solid var(--line);
        background: var(--panel);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 900;
        z-index: 1;
      }

      .timeline-step.ok .timeline-dot {
        background: var(--green-soft);
        color: var(--green);
      }

      .timeline-step.warn .timeline-dot {
        background: var(--yellow-soft);
        color: var(--yellow);
      }

      .timeline-copy {
        border: 2px solid var(--line);
        background: var(--panel);
        padding: 9px;
        display: grid;
        gap: 5px;
      }

      .timeline-copy strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        text-transform: uppercase;
      }

      .timeline-copy small {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .badge {
        min-height: 22px;
        border: 1px solid var(--line);
        background: var(--panel);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 7px;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .badge.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .badge.ok {
        background: var(--green-soft);
        color: var(--green);
      }

      .badge.warn {
        background: var(--yellow-soft);
        color: var(--yellow);
      }

      .locator {
        min-height: 20px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        padding: 0 6px;
        font-size: 10px;
        cursor: copy;
        user-select: all;
        white-space: nowrap;
      }

      .locator.copied {
        color: var(--green);
        background: var(--green-soft);
      }

      .micro {
        min-width: 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.4;
      }

      .kv {
        border: 2px solid var(--line);
        background: var(--panel);
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        align-items: stretch;
      }

      .kv span,
      .kv strong {
        min-width: 0;
        padding: 8px;
        display: flex;
        align-items: center;
      }

      .kv span {
        border-right: 2px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .kv strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 30;
        min-height: 38px;
        border: 2px solid var(--line);
        background: var(--green-soft);
        color: var(--green);
        box-shadow: 4px 4px 0 var(--shadow);
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 900;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 120ms ease, transform 120ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .flow-stack {
        min-width: 980px;
        max-width: 1280px;
      }

      .group-body {
        gap: 10px;
        padding: 12px;
      }

      .route-line {
        border: 2px solid var(--line);
        background: var(--panel);
        box-shadow: 4px 4px 0 var(--shadow);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .route-node {
        min-width: 0;
        min-height: 70px;
        padding: 10px 12px;
        display: grid;
        gap: 6px;
        align-content: center;
        border-left: 2px solid var(--line);
        position: relative;
      }

      .route-node:first-child {
        border-left: 0;
      }

      .route-node::after {
        content: ">";
        position: absolute;
        right: -8px;
        top: 50%;
        width: 16px;
        height: 16px;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 900;
        z-index: 2;
      }

      .route-node:last-child::after {
        content: none;
      }

      .route-node strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        text-transform: uppercase;
      }

      .route-node small {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .route-node.warn {
        background: var(--yellow-soft);
      }

      .route-node.ok {
        background: var(--green-soft);
      }

      .simple-editor {
        display: grid;
        grid-template-columns: 220px minmax(420px, 1fr) 270px;
        gap: 10px;
        align-items: start;
      }

      .decision-panel {
        min-width: 0;
        border: 2px solid var(--line);
        background: var(--panel);
        box-shadow: 4px 4px 0 var(--shadow);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .decision-panel.accounts {
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .decision-panel.exit-test {
        grid-template-rows: auto minmax(0, auto) auto;
      }

      .panel-title {
        min-height: 48px;
        border-bottom: 2px solid var(--line);
        background: var(--panel-2);
        padding: 9px 10px;
        display: grid;
        gap: 3px;
      }

      .panel-title strong {
        font-size: 12px;
        text-transform: uppercase;
      }

      .choice-strip {
        padding: 9px;
        display: grid;
        gap: 7px;
        align-content: start;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .choice {
        min-height: 38px;
        padding: 7px;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        box-shadow: none;
        display: grid;
        gap: 3px;
        text-align: left;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .choice.active {
        background: var(--inverse);
        color: var(--inverse-ink);
      }

      .choice.blocked,
      .choice.disabled {
        opacity: 0.52;
      }

      .choice small {
        color: inherit;
        opacity: 0.72;
        font-size: 9px;
        line-height: 1.35;
      }

      .choice .locator {
        min-height: 15px;
        width: fit-content;
        max-width: 100%;
        padding: 0 4px;
        font-size: 8px;
        opacity: 0.78;
      }

      .account-row {
        min-height: 52px;
        border: 2px solid var(--line);
        background: var(--panel);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 8px;
        text-align: left;
        box-shadow: none;
      }

      .account-row.active {
        background: var(--inverse);
        color: var(--inverse-ink);
      }

      .account-row.blocked {
        opacity: 0.58;
      }

      .account-copy {
        min-width: 0;
        display: grid;
        gap: 4px;
      }

      .account-copy strong,
      .account-copy small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .account-copy small {
        color: inherit;
        opacity: 0.72;
        font-family: var(--mono);
        font-size: 10px;
      }

      .inline-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .compact-config {
        border-top: 2px solid var(--line);
        background: var(--panel-2);
        padding: 9px;
        display: grid;
        gap: 7px;
      }

      #entry-config,
      #route-config {
        display: none;
      }

      .test-panel {
        display: grid;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="mark">GT</div>
          <div class="brand-copy">
            <strong>GetTokens</strong>
            <span class="muted">request orchestration</span>
          </div>
        </div>
        <div class="flow-tools" data-collaboration-id="RO.FLOWGROUPS">
          <input class="input" id="flow-name" aria-label="当前流程组名称" />
          <div class="row">
            <button class="mini active" type="button" data-flow-op="new">+ 自定义组</button>
            <button class="mini" type="button" data-flow-op="clone">复制当前</button>
            <button class="mini warn" type="button" data-flow-op="delete">删除当前</button>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn" type="button" id="reset-all">恢复默认</button>
          <button class="btn primary" type="button" id="apply-flow">应用当前组</button>
        </div>
      </header>

      <main class="workspace" data-collaboration-id="RO.WORKSPACE">
        <div class="flow-stack" id="flow-stack"></div>
      </main>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>

    <script>
	      const state = {
	        activeFlowId: null,
        flowSeed: 2,
        entryModels: {
          codex: "gpt-5.5",
          "claude-code": "claude-sonnet-4.5",
        },
        groups: [
          { id: "codex", label: "Codex 生产组", note: "2 个账号 / 面向 codex" },
          { id: "claude", label: "Claude 灰度组", note: "2 个账号 / 面向 claude code" },
        ],
        accounts: [
          {
            id: "codex-prod-01",
            name: "codex-prod-01",
            group: "codex",
            entrySupport: ["codex"],
            modelMappings: { "codex:gpt-5.5": "gpt-5.5" },
            provider: "OpenAI",
            baseUrl: "https://relay.local/v1",
            proxyPoolEnabled: false,
            defaultRoute: null,
            disabled: false,
          },
          {
            id: "codex-lab-02",
            name: "codex-lab-02",
            group: "codex",
            entrySupport: ["codex", "claude-code"],

      const initialState = JSON.parse(JSON.stringify(state));

	      function currentFlow() {
	        return state.flows.find((flow) => flow.id === state.activeFlowId) || null;
	      }

	      function currentModel(flow = currentFlow()) {
	        return flow ? state.entryModels[flow.cli] || "" : "";
	      }

	      function modelKey(flow = currentFlow()) {
	        return flow ? `${flow.cli}:${currentModel(flow)}` : "";
	      }

	      function computeAccount(account, flow = currentFlow()) {
	        if (!flow) {
	          return { ...account, inGroup: false, cliOk: false, targetModel: null, modelOk: false, routeId: "direct", proxy: state.proxies[0], proxyOk: true, enabled: !account.disabled, active: false, reasons: ["未展开流程组"] };
	        }
	        const inGroup = account.group === flow.groupId;
	        const cliOk = account.entrySupport.includes(flow.cli);
	        const targetModel = account.modelMappings[modelKey(flow)] || null;
        const modelOk = Boolean(targetModel);
        const configuredRoute = Object.prototype.hasOwnProperty.call(flow.routes, account.id) ? flow.routes[account.id] : account.defaultRoute;
        const routeId = account.proxyPoolEnabled ? configuredRoute || "direct" : "direct";
        const proxy = state.proxies.find((item) => item.id === routeId) || state.proxies[0];
        const proxyOk = routeId === "direct" || !proxy.disabled;
        const enabled = !account.disabled;
        const active = inGroup && cliOk && modelOk && enabled && proxyOk;
        const reasons = [];
        if (!inGroup) reasons.push("不在当前账号组");
        if (!cliOk) reasons.push("CLI 不兼容");
        if (cliOk && !modelOk) reasons.push("缺少模型映射");
        if (!enabled) reasons.push("账号已禁用");
        if (!proxyOk) reasons.push("代理不可用");
        return { ...account, inGroup, cliOk, targetModel, modelOk, routeId, proxy, proxyOk, enabled, active, reasons };
      }

	      function currentAccount(flow = currentFlow()) {
	        if (!flow) return null;
	        const computed = state.accounts.map((account) => computeAccount(account, flow));
	        return computed.find((account) => account.id === flow.accountId) || computed.find((account) => account.inGroup) || null;
	      }

      function compatibleAccountsFor(flow, groupId) {
        const scopedFlow = { ...flow, groupId };
        return state.accounts.map((account) => computeAccount(account, scopedFlow)).filter((account) => account.group === groupId && account.active);
      }

	      function selectFirstCompatible(flow) {
	        const currentGroupAccounts = compatibleAccountsFor(flow, flow.groupId);
	        if (currentGroupAccounts.length > 0) {
	          flow.accountId = currentGroupAccounts[0].id;
	          return;
	        }
	        const nextGroup = state.groups.find((group) => compatibleAccountsFor(flow, group.id).length > 0);
	        if (nextGroup) {
	          flow.groupId = nextGroup.id;
	          flow.accountId = compatibleAccountsFor(flow, nextGroup.id)[0]?.id || null;
	          return;
	        }
	        flow.accountId = state.accounts.find((account) => account.group === flow.groupId)?.id || null;
	      }

	      function ensureAccount() {
	        const flow = currentFlow();
	        if (!flow) return;
	        const account = state.accounts.find((item) => item.id === flow.accountId);
	        if (account && account.group === flow.groupId) return;
	        selectFirstCompatible(flow);
	      }

      function toLocator(value) {
        return String(value).replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").toUpperCase();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 1200);
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const input = document.createElement("textarea");
        input.value = text;
        input.setAttribute("readonly", "");
        input.style.position = "absolute";
        input.style.left = "-9999px";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        document.body.removeChild(input);
      }

	      function invalidate(action) {
	        const flow = currentFlow();
	        if (!flow) return;
	        flow.lastAction = action;
	        flow.applied = false;
	        flow.test = null;
      }

      function flowSummary(flow) {
        const group = state.groups.find((item) => item.id === flow.groupId);
        const account = state.accounts.find((item) => item.id === flow.accountId);
        return `01 ${flow.cli} / 02 ${group?.label || "none"} / 03 ${account?.name || "none"} / 04 test`;
      }

      function testState(flow) {
        const status = flow?.test?.status || "pending";
        const accepted = status === "accepted";
        const rejected = status === "blocked";
        return {
          className: accepted ? "ok" : "warn",
          label: accepted ? "测试通过" : rejected ? "测试未通过" : "待测试",
          detail: accepted ? `最近测试 ${flow.test.time}` : rejected ? flow.test.reason : "点击下方按钮执行",
          badge: accepted ? "测试通过" : rejected ? "测试未通过" : "待测试",
        };
      }

      function boardTemplate(flow) {
        return `
          <div class="group-body" data-collaboration-id="RO.FLOWBODY.${toLocator(flow.id)}">
            <div class="route-line" id="result-list" data-collaboration-id="RO.PATH.${toLocator(flow.id)}"></div>

            <div class="simple-editor">
              <section class="decision-panel" data-collaboration-id="RO.CARD.ENTRY">

              <section class="decision-panel accounts" data-collaboration-id="RO.CARD.ACCOUNTS">

                <header class="panel-title">

                </header>
                <div class="choice-strip" id="route-list"></div>
                <div class="compact-config" id="route-config"></div>
                <div class="compact-config test-panel" id="result-config"></div>
              </section>
            </div>
          </div>
        `;
      }

	      function bindBoardRefs() {
	        entryList = document.getElementById("entry-list");
	        entryConfig = document.getElementById("entry-config");
	        accountList = document.getElementById("account-list");
	        accountConfig = document.getElementById("account-config");
	        routeList = document.getElementById("route-list");

	        resultConfig = document.getElementById("result-config");
	      }

	      function renderFlows() {
	        const flow = currentFlow();
	        flowName.value = flow ? flow.label : "";
	        flowName.placeholder = flow ? "" : "未选中流程组";
	        flowName.disabled = !flow;
	        if (applyButton) applyButton.disabled = !flow;
	        const cloneButton = document.querySelector('[data-flow-op="clone"]');
	        const deleteButton = document.querySelector('[data-flow-op="delete"]');
	        if (cloneButton) cloneButton.disabled = !flow;
	        if (deleteButton) deleteButton.disabled = !flow || flow.id === "default" || state.flows.length <= 1;
	        flowStack.innerHTML = state.flows
	          .map(
	            (item, index) => {
		              const active = flow && item.id === flow.id;
		              const account = currentAccount(item);
		              const ready = state.accounts.map((accountItem) => computeAccount(accountItem, item)).filter((accountItem) => accountItem.group === item.groupId && accountItem.active).length;
                  const test = testState(item);
		              return `
	                <section class="flow-group ${active ? "active" : ""}" data-collaboration-id="RO.FLOW.${toLocator(item.id)}">

		                        <span class="badge ${test.className === "ok" ? "ok" : ""}">${test.label}</span>

      function renderEntry() {
        const flow = currentFlow();
        entryList.innerHTML = [
          { id: "codex", label: "codex", note: "Codex 请求入口" },

          .map(

	        entryConfig.innerHTML = `

	      function renderAccounts() {
	        const flow = currentFlow();
	        const account = currentAccount();
	        const computed = state.accounts.map((item) => computeAccount(item));
	        const groupItems = state.groups
	          .map((group) => {

	        accountList.innerHTML = `<span class="label">账号组</span><div class="choice-grid">${groupItems}</div><span class="label">账号</span>${accountItems}`;
	        accountConfig.innerHTML = `
	          <div class="config-title"><span class="label">当前账号</span><span class="badge ${account?.active ? "ok" : "warn"}">${account?.active ? "ready" : "blocked"}</span></div>
          <div class="row">
            <button class="mini ${account?.proxyPoolEnabled ? "warn" : "active"}" type="button" data-account-op="proxy" data-account-id="${account?.id || ""}">${account?.proxyPoolEnabled ? "关闭代理池" : "启用代理池"}</button>
            <button class="mini" type="button" data-account-op="toggle" data-account-id="${account?.id || ""}">${account?.disabled ? "启用账号" : "禁用账号"}</button>

      function renderRoutes() {
        const account = currentAccount();
        if (!account) {
          routeList.innerHTML = "";
          routeConfig.innerHTML = "<span class='label'>未选中账号</span>";
          return;
        }
        const visibleProxies = account.proxyPoolEnabled ? state.proxies : state.proxies.filter((proxy) => proxy.id === "direct");
        routeList.innerHTML = visibleProxies
          .map(
            (proxy) => `
              <button class="choice ${account.routeId === proxy.id ? "active" : ""} ${proxy.disabled ? "disabled" : ""}" type="button" data-route-id="${proxy.id}" data-collaboration-id="RO.ROUTE.${toLocator(proxy.id)}">
                <span class="locator">RO.ROUTE.${toLocator(proxy.id)}</span>
                <strong>${proxy.label}</strong>
                <small>${account.proxyPoolEnabled ? proxy.note : "启用账号代理池后再选择代理出口"}</small>
              </button>
            `
          )
          .join("");
        routeConfig.innerHTML = `
          <div class="config-title"><span class="label">当前出口</span><span class="badge accent">${account.proxy.label}</span></div>
          <div class="kv"><span>模式</span><strong>${account.proxyPoolEnabled ? "代理池可选" : "锁定直连"}</strong></div>
        `;
      }

      function renderResultCard() {
        const flow = currentFlow();
        const account = currentAccount();
        const group = state.groups.find((item) => item.id === flow.groupId);
        const test = testState(flow);
        resultList.innerHTML = `

            <strong>${group?.label || "未选择"}</strong>

          <div class="route-node ${account?.active ? "ok" : "warn"}">

          <div class="route-node ${test.className}">
            <small>测试</small>
            <strong>${test.label}</strong>

	      function render() {
	        const flow = currentFlow();
	        if (flow) ensureAccount();

	          renderEntry();
	          renderAccounts();
	          renderRoutes();
	          renderResultCard();
	        }
	        document.querySelectorAll(".locator").forEach((item) => item.setAttribute("title", "点击复制定位器"));
	      }

      function makeCustomFlow(source) {
        const serial = String(state.flowSeed++).padStart(2, "0");
        const base = source || { cli: "codex", groupId: "codex", accountId: "codex-prod-01", routes: {} };
        return {
          id: `custom-flow-${serial}`,
          label: source ? `${source.label} 副本 ${serial}` : `自定义组 ${serial}`,
          cli: base.cli,
          groupId: base.groupId,
          accountId: base.accountId,
          routes: JSON.parse(JSON.stringify(base.routes || {})),
          lastAction: source ? "已复制流程组" : "已新建流程组",
          applied: false,
          test: null,
        };
      }

      document.addEventListener("click", async (event) => {
        const locator = event.target.closest(".locator");
        if (locator) {
          event.preventDefault();
          event.stopPropagation();
          const text = locator.textContent.trim();
          try {
            await copyText(text);
            locator.classList.add("copied");
            window.setTimeout(() => locator.classList.remove("copied"), 900);
            showToast(`已复制 ${text}`);
          } catch (error) {
            showToast(`复制失败 ${text}`);
          }
          return;
        }

	        const flowSwitch = event.target.closest("[data-flow-toggle]");
	        if (flowSwitch) {
	          const nextFlowId = flowSwitch.dataset.flowToggle;
	          state.activeFlowId = state.activeFlowId === nextFlowId ? null : nextFlowId;
	          render();
	          return;
	        }

        const flowOp = event.target.closest("[data-flow-op]");
        if (flowOp) {
          const op = flowOp.dataset.flowOp;
          if (op === "new") {
            const flow = makeCustomFlow(null);
            state.flows.push(flow);
            state.activeFlowId = flow.id;
          }
	          if (op === "clone") {
	            const source = currentFlow();
	            if (source) {
	              const flow = makeCustomFlow(source);
	              state.flows.push(flow);
	              state.activeFlowId = flow.id;
	            }
	          }
	          if (op === "delete" && currentFlow() && state.flows.length > 1 && state.activeFlowId !== "default") {
	            const index = state.flows.findIndex((flow) => flow.id === state.activeFlowId);
	            state.flows.splice(index, 1);
	            state.activeFlowId = null;
	          }
          render();
          return;
        }

        const cli = event.target.closest("[data-cli]");
	        if (cli) {
	          const flow = currentFlow();
	          flow.cli = cli.dataset.cli;
	          selectFirstCompatible(flow);
	          invalidate("已切换入口");
	          render();
	          return;
	        }

        const group = event.target.closest("[data-group-id]");
	        if (group) {
	          const flow = currentFlow();
	          flow.groupId = group.dataset.groupId;
	          selectFirstCompatible(flow);
	          invalidate("已切换账号组");
	          render();
          return;
        }

        const accountSelect = event.target.closest("[data-account-select]");
        if (accountSelect) {
          const flow = currentFlow();
          flow.accountId = accountSelect.dataset.accountSelect;
          flow.lastAction = "已选择账号";
          flow.applied = false;
          render();
          return;
        }

        const accountOp = event.target.closest("[data-account-op]");
        if (accountOp) {
          const account = state.accounts.find((item) => item.id === accountOp.dataset.accountId);
          if (!account) return;
          currentFlow().accountId = account.id;
          if (accountOp.dataset.accountOp === "proxy") {
            account.proxyPoolEnabled = !account.proxyPoolEnabled;
            invalidate(account.proxyPoolEnabled ? "已启用账号代理池" : "已关闭账号代理池");
          }
          if (accountOp.dataset.accountOp === "toggle") {
            account.disabled = !account.disabled;
            invalidate(account.disabled ? "已禁用账号" : "已启用账号");
          }
          render();
          return;
        }

        const route = event.target.closest("[data-route-id]");
        if (route) {
          const account = currentAccount();
          const routeId = route.dataset.routeId;
          const proxy = state.proxies.find((item) => item.id === routeId);
          if (!account || !proxy || proxy.disabled || (!account.proxyPoolEnabled && routeId !== "direct")) return;
          currentFlow().routes[account.id] = routeId === "direct" ? null : routeId;
          invalidate("已更新账号出口");
          render();
          return;
        }

        const button = event.target.closest("button");
        if (!button) return;
	        if (button.id === "apply-flow") {
	          const flow = currentFlow();
	          if (!flow) return;
	          const account = currentAccount();
	          if (!account?.active) {
	            flow.lastAction = "当前链路不可应用";
	            flow.applied = false;
	            render();
	            return;
	          }
	          flow.lastAction = "已应用当前组";
	          flow.applied = true;
          render();
          return;
        }
	        if (button.id === "run-test") {
	          const flow = currentFlow();
	          if (!flow) return;
	          const account = currentAccount();
          const now = new Date();
          const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
          if (!account?.active) {
            flow.lastAction = "当前链路不可测试";
            flow.test = {
              time,
              status: "blocked",
              reason: account?.reasons?.join(" / ") || "无可用账号",
            };
            render();
            return;
          }
          flow.lastAction = "已测试";
          flow.test = {
            time,
            status: "accepted",
          };
          render();
          return;
        }
        if (button.id === "reset-all") {
          Object.keys(state).forEach((key) => delete state[key]);
          Object.assign(state, JSON.parse(JSON.stringify(initialState)));
          render();
        }
      });

	      document.addEventListener("input", (event) => {
	        if (event.target.id !== "flow-name") return;
	        const flow = currentFlow();
	        if (!flow) return;
        flow.label = event.target.value.trim() || "未命名流程";
        flow.lastAction = "已重命名流程组";
        flow.applied = false;
        renderFlows();
        renderResultCard();
      });

      render();
    </script>
  </body>
</html>
